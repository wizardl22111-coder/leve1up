<?xml version="1.0" encoding="utf-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .aed-symbol {
        fill: currentColor;
        stroke: currentColor;
        stroke-width: 0.5;
      }
    </style>
  </defs>
  <!-- رمز الدرهم الإماراتي د.إ -->
  <g class="aed-symbol">
    <!-- الدائرة الأساسية -->
    <circle cx="8" cy="6" r="3" fill="none" stroke-width="1"/>
    <!-- الخط العمودي -->
    <line x1="8" y1="3" x2="8" y2="9" stroke-width="1"/>
    <!-- الخط الأفقي -->
    <line x1="5" y1="6" x2="11" y2="6" stroke-width="1"/>
    <!-- الخط السفلي المميز للدرهم -->
    <path d="M3 11 Q8 13 13 11" fill="none" stroke-width="1"/>
    <!-- النقطة المميزة -->
    <circle cx="12" cy="4" r="0.8" fill="currentColor"/>
  </g>
</svg>
