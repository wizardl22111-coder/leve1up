<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- رمز الدرهم الإماراتي الجديد مبسط -->
  <g fill="white">
    <!-- الشكل الأساسي للرمز -->
    <rect x="2" y="2" width="6" height="10" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
    
    <!-- الخط العمودي الداخلي -->
    <rect x="4.6" y="3" width="0.8" height="8"/>
    
    <!-- الخط الأفقي الداخلي -->
    <rect x="3" y="6.6" width="4" height="0.8"/>
    
    <!-- الجزء الأيمن -->
    <rect x="10" y="4" width="4" height="5" rx="0.5"/>
    <rect x="11" y="5" width="2" height="3" rx="0.3" fill="black"/>
    
    <!-- النقطة العلوية -->
    <circle cx="12" cy="1.5" r="0.8"/>
    
    <!-- الخط السفلي -->
    <path d="M1 14 Q8 15 15 14" stroke="white" stroke-width="1" fill="none"/>
  </g>
</svg>

